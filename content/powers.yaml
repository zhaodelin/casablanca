# 六大系能力体系
# 口径：强化系归属生灵系（官方 2019-09-11 原话），治愈＝设计稿里的「回复」
note: 强化系官方归在生灵系下（「因为比较常见，常被单独提起」）；治愈在设计稿里写作「回复」。造物系则是每个能化形的妖精都自带。

series:
  - key: yuling
    name: 御灵系
    en: SPIRIT
    role: 最基础、最普遍
    desc: 操控五行元素。官方说这是最常见的能力，人人皆可修炼；能不能变强，看个人。
    subs:
      - { name: 金, desc: 金属性灵力，可硬化、锋利化；也叫「御金」, who: [小黑, 无限, 泽宇, 鹿野] }
      - { name: 木, desc: 木属性灵力，操控植物（设计稿写作「木系」）, who: [风息, 洛竹] }
      - { name: 火, desc: 火属性灵力, who: [天虎, 哪吒, 天介, 兆岳] }
      - { name: 土, desc: 土属性灵力，土系的人往往体格结实, who: [叶子, 兆岳, 紫实, 甲, 乙] }
      - { name: 冰, desc: 冰属性灵力，控温结冰, who: [虚淮] }

  - key: suoyu
    name: 锁御系
    en: BIND
    role: 封印、镇压、阵法
    desc: 以压制、拘束、封锁为核心。进阶方向包括灵体层面的「灵御」、灵识层面的「制灵」，以及阵法与法器。
    subs:
      - { name: 灵御, desc: 在灵体层面压制、拘束目标, who: [哪吒] }
      - { name: 制灵, desc: 封锁灵识或灵力运转, who: [若水] }
      - { name: 阵法, desc: 以阵图布控，官方称鹤天为「锁御系阵法大师」, who: [鹤天] }
      - { name: 法器, desc: 以法器行使锁御之力，如大松独创的「流石甲」, who: [大松] }

  - key: zaowu
    name: 造物系
    en: CRAFT
    role: 造物与复原
    desc: 官方设定：每个能「化形」的妖精都自带造物系能力，强弱有别；只要不伤及灵体都能复原，只是快慢不同（神兽例外）。
    subs:
      - { name: 仿生, desc: 仿造生物的结构造物, who: [鸠老] }
      - { name: 画灵, desc: 以画为媒造物；与生灵系合技，写作「生灵系*造物系-画灵」, who: [画虎] }
      - { name: 复原, desc: 化形妖精自带，伤及灵体前都能复原, who: [] }

  - key: shengling
    name: 生灵系
    en: LIFE
    role: 生命、感知、强化
    desc: 与生命体本身相关：治疗、感知、身体强化都在这里。强化系是它最常见的一支，常被单独提起。
    subs:
      - { name: 回复, desc: 治疗伤势；设计稿写「回复」，访谈与剧情里称「治疗」, who: [逸风, 乙, 青峰, 晓月] }
      - { name: 洞察, desc: 感知、看破, who: [鸠老] }
      - { name: 观灵, desc: 感知灵体与灵力, who: [紫实] }
      - { name: 烛微, desc: 极细微的感知，白游是分馆感知组组长, who: [白游] }
      - { name: 追毫, desc: 追踪痕迹，逐毫末之迹, who: [泽宇, 鹿野] }
      - { name: 薄音, desc: 以音律为媒介, who: [闵翔] }
      - { name: 豪夺, desc: 夺取他人的灵力与能力, who: [风息] }
      - { name: 幻化, desc: 形体变化, who: [哪吒] }
      - { name: 隐匿, desc: 气息与身形隐藏, who: [羽夕] }
      - { name: 念磁, desc: 以念力牵引、吸附, who: [冠萱] }
      - { name: 培元, desc: 固本培元，回复类的基础功夫, who: [潘靖] }
      - { name: 化生, desc: 促进生长、转化生机, who: [潘靖] }
      - { name: 焚瘴, desc: 以瘴气与灼烧侵蚀, who: [天介] }
      - { name: 强化, desc: 身体强化，官方说它属于生灵系（凌荆 / 巨力 / 强化）, who: [鸠老, 若水, 羽夕] }

  - key: xinling
    name: 心灵系
    en: MIND
    role: 精神、感知干扰
    desc: 作用于意识与感知：传讯、清洗记忆、摄心控制、造梦、操控傀儡。
    subs:
      - { name: 传音, desc: 心灵传讯, who: [潘靖] }
      - { name: 清洗, desc: 清洗记忆与精神痕迹, who: [冠萱] }
      - { name: 摄心, desc: 操控妖精为己所用, who: [肄目] }
      - { name: 戏梦, desc: 造梦，在梦境层面干预, who: [西木子] }
      - { name: 傀儡, desc: 操控傀儡, who: [阿赫] }

  - key: kongjian
    name: 空间系
    en: SPACE
    role: 空间、位移、领域
    desc: 与空间本身相关：领域、传送、吞噬、蕴藏、转移。公认稀有的体系。
    subs:
      - { name: 领域, desc: 把一片空间变成自己的领域, who: [小黑] }
      - { name: 传送, desc: 瞬间位移, who: [小黑] }
      - { name: 吞噬, desc: 吞掉空间与物体, who: [无限] }
      - { name: 蕴藏, desc: 收纳、储藏, who: [花轮] }
      - { name: 转移, desc: 把目标转移走，只能影响灵力低微的生命体, who: [爽叔] }
