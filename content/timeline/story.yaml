# 剧情时间线：故事内部的顺序。sort 用 0001、0002 这样的序号，因为「很久以前」没有日期。

events:
  - date: 很久以前
    sort: '0001'
    title: 妖灵会馆
    text: 妖精与人类签下共存的规矩，妖灵会馆成立。老君是它的创建者之一。
  - date: 战乱年代
    sort: '0002'
    title: 蓝溪镇
    text: 老君在战乱里捡回人类少女清凝，把她养在蓝溪镇。君清篇的前史由此展开。
  - date: 那一天
    sort: '0003'
    title: 小黑失去家园
    text: 猫妖小黑栖身的森林被毁，他开始在人类的城市间流浪。
  - date: TV 第一集
    sort: '0004'
    title: 遇见小白
    text: 小黑被人类少女罗小白捡回家，第一次有了「主人」和家人，也第一次吃到了猫粮之外的东西。
  - date: 电影 1
    sort: '0005'
    title: 被带走
    text: 妖灵会馆派出执行者无限，要把小黑从人类世界带走。小白追着车跑了很久。
  - date: 电影 1
    sort: '0006'
    title: 海上的旅途
    text: 无限带着小黑漂在海上、穿过城市。师徒之情在旅途里生根，小黑第一次知道「强大」可以不用来伤害。
  - date: 电影 1
    sort: '0007'
    title: 风息的领域
    text: 旧日妖精风息夺取小黑的灵质空间，想用「领域」为人妖之争画下句点。小黑在领域里救回了所有人。
  - date: 电影 1
    sort: 0008
    title: 拜师
    text: 风息化作一棵大树。小黑回到无限身边，正式成为他的弟子。
  - date: 电影 2
    sort: 0009
    title: 小镇生活
    text: 小黑跟着师父在小镇上住下，做任务、上学、看云。这是他们最平静的一段日子。
  - date: 电影 2
    sort: '0010'
    title: 分会馆遇袭
    text: 分会馆被袭，妖精世界维持已久的和平被打破；会馆下达「全新任务」。
  - date: 电影 2
    sort: '0011'
    title: 分离危机
    text: 师徒二人因任务面临分离。小黑与师姐鹿野并肩，灵遥的强硬路线浮出水面。
  - date: TV 2026
    sort: '0012'
    title: 日常继续
    text: 第 45 集《美好的暑假如此短暂》。打过再大的仗，日子还是要一天天过。
